[package]
name = "rusted-garlic"
authors = ["Robert Hubley"]
description = "Generate realistic artificial DNA sequences"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dfam-consortium/rusted-garlic"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
itertools = "0.10.5"
rand = "0.8.5"
clap = { version = "4.4.6", features = ["derive"] }
serde = { version = "1.0.159" , features = ["derive"] }
serde_json = "1.0.93"
flate2 = "1"
log = "0.4"
env_logger = "0.10"
